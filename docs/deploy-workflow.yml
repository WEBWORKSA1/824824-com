# Optional: automatic builds with GitHub Actions.
# To enable, copy this file to .github/workflows/deploy.yml in the GitHub web editor
# (Add file > Create new file). After that, every push to main rebuilds the site with
# build.py and publishes _site/ to the gh-pages branch that GitHub Pages serves.
# Upload the PNG images to assets/img/ on main first, so each build includes them.
name: Build and publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-site
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: |
          python -m pip install --quiet pyyaml
          python build.py
          python tests/qa.py
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
